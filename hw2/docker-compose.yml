services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20

  liquibase:
    image: liquibase/liquibase:4.29.2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/liquibase/changelog:ro
    command:
      - --url=jdbc:postgresql://db:5432/marketplace
      - --username=marketplace
      - --password=marketplace
      - --search-path=/liquibase/changelog
      - --changelog-file=db.changelog-master.yaml
      - update

  app:
    build: .
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@db:5432/marketplace
      ORDER_RATE_LIMIT_MINUTES: 1
      JWT_SECRET: local-dev-jwt-secret-for-homework-only-0123456789
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
    ports:
      - "8080:8080"

volumes:
  pgdata:
