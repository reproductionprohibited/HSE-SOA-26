openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: 'API сервиса маркетплейса: каталог товаров, заказы, промокоды.'
servers:
  - url: http://localhost:8080

tags:
  - name: auth
  - name: products
  - name: orders
  - name: promo-codes

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация пользователя
      description: Через регистрацию доступны роли `USER` и `SELLER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Аутентификация, возвращает access + refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Обновление access token по refresh token
      description: Возвращает новую пару токенов (refresh token тоже обновляется).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/RefreshTokenInvalid'
        '500':
          $ref: '#/components/responses/InternalError'

  /products:
    post:
      tags: [products]
      operationId: createProduct
      summary: Создание товара
      description: 'Роли: `SELLER` (товар привязывается к продавцу), `ADMIN`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [products]
      operationId: listProducts
      summary: Список товаров с пагинацией и фильтрацией
      description: 'Роли: все.'
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Номер страницы, начиная с 0
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Размер страницы
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: category
          in: query
          description: Категория (точное совпадение)
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Страница товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [products]
      operationId: getProduct
      summary: Получение товара по ID
      description: 'Роли: все.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Обновление товара (полная замена полей)
      description: 'Роли: `SELLER` — только свои товары, `ADMIN` — любые.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Товар обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Мягкое удаление (перевод в статус ARCHIVED)
      description: 'Роли: `SELLER` — только свои товары, `ADMIN` — любые.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Товар переведён в статус ARCHIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создание заказа
      description: 'Роли: `USER`, `ADMIN`. Заказ оформляется на текущего пользователя.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PromoCodeError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Получение заказа по ID
      description: 'Роли: `USER` — только свои заказы, `ADMIN` — любые.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [orders]
      operationId: updateOrder
      summary: Обновление позиций заказа (только в статусе CREATED)
      description: 'Роли: `USER` — только свои заказы, `ADMIN` — любые.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Заказ обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Отмена заказа (из статусов CREATED, PAYMENT_PENDING)
      description: 'Роли: `USER` — только свои заказы, `ADMIN` — любые.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /promo-codes:
    post:
      tags: [promo-codes]
      operationId: createPromoCode
      summary: Создание промокода
      description: 'Роли: `SELLER`, `ADMIN`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
      responses:
        '201':
          description: Промокод создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token из `/auth/login` или `/auth/refresh`.
        Claims: `sub` — ID пользователя, `role` — роль, `type` — `access`.

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: |
        Ошибка валидации входных данных (`VALIDATION_ERROR`).
        В `details.fields` перечислены поля и нарушения.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: VALIDATION_ERROR
            message: Request validation failed
            details:
              fields:
                - field: body.price
                  message: Input should be greater than or equal to 0.01
                  type: greater_than_equal
                - field: body.items[0].quantity
                  message: Input should be less than or equal to 999
                  type: less_than_equal
    Unauthorized:
      description: Access token отсутствует, невалиден (`TOKEN_INVALID`) или истёк (`TOKEN_EXPIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: TOKEN_EXPIRED
            message: Access token has expired
    InvalidCredentials:
      description: Неверный email или пароль (`INVALID_CREDENTIALS`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: INVALID_CREDENTIALS
            message: Invalid email or password
    RefreshTokenInvalid:
      description: Refresh token невалиден или истёк (`REFRESH_TOKEN_INVALID`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: REFRESH_TOKEN_INVALID
            message: Refresh token is invalid or expired
    Forbidden:
      description: |
        Недостаточно прав: роль не допускает операцию или чужой товар (`ACCESS_DENIED`),
        заказ принадлежит другому пользователю (`ORDER_OWNERSHIP_VIOLATION`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: ACCESS_DENIED
            message: Role USER is not allowed to perform this operation
    InternalError:
      description: Непредвиденная ошибка сервера (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: INTERNAL_ERROR
            message: Internal server error
    NotFound:
      description: Сущность не найдена (`PRODUCT_NOT_FOUND`, `ORDER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: PRODUCT_NOT_FOUND
            message: Product not found
            details:
              product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    Conflict:
      description: |
        Конфликт бизнес-правил: `PRODUCT_INACTIVE`, `ORDER_HAS_ACTIVE`,
        `INVALID_STATE_TRANSITION`, `INSUFFICIENT_STOCK`, `PROMO_CODE_ALREADY_EXISTS`,
        `USER_ALREADY_EXISTS`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: INSUFFICIENT_STOCK
            message: Insufficient stock
            details:
              items:
                - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  requested: 5
                  available: 2
    PromoCodeError:
      description: Промокод неприменим (`PROMO_CODE_INVALID`, `PROMO_CODE_MIN_AMOUNT`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: PROMO_CODE_MIN_AMOUNT
            message: Order amount is below promo code minimum
            details:
              min_order_amount: 1000.00
              order_amount: 500.00
    TooManyRequests:
      description: Превышен лимит частоты операций с заказами (`ORDER_LIMIT_EXCEEDED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: ORDER_LIMIT_EXCEEDED
            message: Too many order operations
            details:
              retry_after_seconds: 42

  schemas:
    # ---------- Errors ----------
    ErrorCode:
      type: string
      description: |
        Машиночитаемый код ошибки. `NOT_FOUND` и `METHOD_NOT_ALLOWED` возвращаются
        для несуществующих путей и неподдерживаемых HTTP-методов.
      enum:
        - PRODUCT_NOT_FOUND
        - PRODUCT_INACTIVE
        - ORDER_NOT_FOUND
        - ORDER_LIMIT_EXCEEDED
        - ORDER_HAS_ACTIVE
        - INVALID_STATE_TRANSITION
        - INSUFFICIENT_STOCK
        - PROMO_CODE_INVALID
        - PROMO_CODE_MIN_AMOUNT
        - PROMO_CODE_ALREADY_EXISTS
        - ORDER_OWNERSHIP_VIOLATION
        - VALIDATION_ERROR
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - REFRESH_TOKEN_INVALID
        - INVALID_CREDENTIALS
        - USER_ALREADY_EXISTS
        - ACCESS_DENIED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Человекочитаемое описание
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Дополнительные данные

    # ---------- Auth ----------
    UserRole:
      type: string
      enum: [USER, SELLER, ADMIN]
    RegistrableRole:
      type: string
      description: Роли, доступные при регистрации
      enum: [USER, SELLER]
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          allOf:
            - $ref: '#/components/schemas/RegistrableRole'
          default: USER
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 128
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Время жизни access token в секундах
    UserResponse:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time

    # ---------- Products ----------
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
    ProductCreate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          multipleOf: 0.01
          maximum: 9999999999.99
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductUpdate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          multipleOf: 0.01
          maximum: 9999999999.99
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductResponse:
      type: object
      required: [id, name, description, price, stock, category, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
        stock:
          type: integer
          format: int32
        category:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          nullable: true
          description: Продавец-владелец товара (пользователь, создавший товар)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductPage:
      type: object
      required: [content, totalElements, page, size]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32

    # ---------- Orders ----------
    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]
    OrderItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
    OrderCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        promo_code:
          type: string
          nullable: true
          pattern: '^[A-Z0-9_]{4,20}$'
    OrderUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
    OrderItemResponse:
      type: object
      required: [id, product_id, quantity, price_at_order]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        price_at_order:
          type: number
          format: decimal
          description: Цена за единицу на момент заказа
    OrderResponse:
      type: object
      required: [id, user_id, status, items, total_amount, discount_amount, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        promo_code:
          type: string
          nullable: true
          description: Применённый промокод
        total_amount:
          type: number
          format: decimal
          description: Итоговая сумма с учётом скидки
        discount_amount:
          type: number
          format: decimal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---------- Promo codes ----------
    DiscountType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]
    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value, max_uses, valid_from, valid_until]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
        discount_type:
