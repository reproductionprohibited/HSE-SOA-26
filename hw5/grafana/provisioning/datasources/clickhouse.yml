apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      # Read-only пользователь с SELECT только на витрины agg_* (миграции 20261125300*)
      username: grafana
      defaultDatabase: analytics
    secureJsonData:
      password: grafana
