name: hw5

x-kafka-bootstrap: &kafka-bootstrap kafka-1:9092,kafka-2:9092,kafka-3:9092

# Узел кластера Kafka: KRaft combined-режим (broker + controller). Три узла: кворум контроллеров из двух
# узлов не переживает потерю ни одного, из трёх — переживает потерю одного.
x-kafka-node: &kafka-node
  image: confluentinc/cp-kafka:7.7.1
  environment: &kafka-env
    CLUSTER_ID: hw5-movie-analytics-01
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # Служебные топики тоже реплицированы на все узлы
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: -Xms192m -Xmx320m
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 15s

services:
  # ---------- Kafka: кластер из 3 узлов + Schema Registry ----------
  kafka-1:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092

  kafka-2:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092

  kafka-3:
    <<: *kafka-node
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Топик movie-events + регистрация Avro-схемы (одноразово)
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PARTITIONS: 3
      REPLICATION_FACTOR: 3
      MIN_INSYNC_REPLICAS: 2
    volumes:
      - ./kafka/init.sh:/init.sh:ro
      - ./schemas:/schemas:ro
    entrypoint: ["bash", "/init.sh"]
    restart: "no"

  # ---------- ClickHouse ----------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      KAFKA_BROKERS: *kafka-bootstrap
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/analytics.xml:/etc/clickhouse-server/users.d/analytics.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "analytics", "--password", "analytics", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  ch-migrate:
    image: ghcr.io/amacneil/dbmate:2.26.0
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: clickhouse://analytics:analytics@clickhouse:9000/analytics
      DBMATE_MIGRATIONS_DIR: /db/migrations
    volumes:
      - ./clickhouse/migrations:/db/migrations:ro
    command: ["--wait", "--no-dump-schema", "up"]
    restart: "no"

  # ---------- PostgreSQL (готовые агрегаты) ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "analytics", "-d", "analytics"]
      interval: 5s
      timeout: 5s
      retries: 30

  pg-migrate:
    image: ghcr.io/amacneil/dbmate:2.26.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://analytics:analytics@postgres:5432/analytics?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
    volumes:
      - ./postgres/migrations:/db/migrations:ro
    command: ["--wait", "--no-dump-schema", "up"]
    restart: "no"

  # ---------- Сервис агрегации: ClickHouse → метрики → PostgreSQL ----------
  aggregation-service:
    build: ./aggregation-service
    depends_on:
      ch-migrate:
        condition: service_completed_successfully
      pg-migrate:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DB: analytics
      POSTGRES_DSN: postgresql://analytics:analytics@postgres:5432/analytics
      AGG_INTERVAL_SECONDS: ${AGG_INTERVAL_SECONDS:-60}
      AGG_LOOKBACK_DAYS: ${AGG_LOOKBACK_DAYS:-14}
      TOP_N: 10
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 5s

  # ---------- Продюсер: HTTP API + генератор (один образ) ----------
  movie-service:
    build: ./movie-service
    image: hw5-movie-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment: &movie-env
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 5s

  event-generator:
    image: hw5-movie-service
    depends_on:
      movie-service:
        condition: service_started  # гарантирует, что образ уже собран
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *movie-env
      GENERATOR_BACKFILL_DAYS: 14
      GENERATOR_NEW_USERS_PER_DAY: 60
      GENERATOR_EPS: 5
    command: ["python", "-m", "app.generator"]
    healthcheck:
      # Генератор трогает heartbeat-файл после каждой публикации; файл старше минуты — генератор завис
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/generator-heartbeat') > 60)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ---------- Grafana: дашборд по агрегатам из ClickHouse ----------
  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      ch-migrate:
        condition: service_completed_successfully
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.5.1
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/movie-analytics.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # ---------- Интеграционный тест: make test ----------
  tests:
    build: ./tests
    profiles: ["test"]
    depends_on:
      movie-service:
        condition: service_healthy
      ch-migrate:
        condition: service_completed_successfully
    environment:
      MOVIE_SERVICE_URL: http://movie-service:8000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DB: analytics

volumes:
  clickhouse-data:
  postgres-data:
