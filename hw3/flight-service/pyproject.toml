[project]
name = "flight-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "grpcio>=1.68",
    "grpcio-reflection>=1.68",
    "protobuf>=5.28",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
codegen = [
    "grpcio-tools>=1.68",
]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["generated"]
venvPath = "."
venv = ".venv"
